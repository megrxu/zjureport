name: Build LaTeX

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            zjureport.dtx
            zjureport-example.tex
          compiler: xelatex
          pre_compile: "xetex zjureport.ins"

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZJU-Report-PDFs
          path: |
            zjureport.pdf
            zjureport-example.pdf